font=JetBrainsMono NF:size=16
pad=8x8

[colors-dark]
foreground=e0e0e0        # cold moonlight — silver on black
background=000000        # absolute void — the universe itself

## Normal colors
regular0=000000          # absolute void — star field between
regular1=383838          # dark gray — shadow crater
regular2=202020          # near black — far side of the moon
regular3=888888          # silver — illuminated surface
regular4=303030          # void shadow — deep crater
regular5=606060          # mid gray — terminator line
regular6=484848          # charcoal — rock silhouette
regular7=e0e0e0          # cold moonlight — lit face

## Bright colors
bright0=181818           # raised shadow — faint star
bright1=606060           # vivid gray — reflected earthlight
bright2=404040           # rich charcoal — dark mare
bright3=c8c8c8           # light silver — peak brightness
bright4=282828           # clear dark — between craters
bright5=a0a0a0           # bright silver — high albedo
bright6=808080           # medium silver — mid shine
bright7=ffffff           # pure white — total reflection

## Dimmed colors
dim0=000000              # void — no photon escapes
dim1=101010              # dim shadow — barely visible
dim2=0c0c0c              # dim crater — absorbed light
dim3=181818              # dim rock — cold surface

alpha=0.88
