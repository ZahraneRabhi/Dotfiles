font=JetBrainsMono NF:size=16
pad=8x8

[colors-dark]
foreground=aaff00        # acid-green — matrix phosphor glow
background=050800        # near-black with green tint

## Normal colors
regular0=0a0f00          # deep black-green
regular1=ff3333          # red — errors/warnings (keep contrast)
regular2=aaff00          # acid-green — primary accent
regular3=ccff44          # lime-yellow highlight
regular4=55cc00          # mid-green glow
regular5=7fff00          # chartreuse — secondary accent
regular6=33ee66          # teal-green edge
regular7=aaccaa          # dim phosphor — muted text

## Bright colors
bright0=1a2200           # dark green-black
bright1=ff5555           # bright red — urgent/errors
bright2=ccff00           # vivid acid-green
bright3=eeff77           # soft lime glow
bright4=88ee00           # mid bright-green
bright5=aaff44           # highlight green
bright6=66ffaa           # light matrix teal
bright7=eeffee           # near-white with green cast

## Dimmed colors
dim0=000000              # full black
dim1=1a3300              # dark muted green for subtle accents

alpha=0.1             # semi-transparent glassy effect
