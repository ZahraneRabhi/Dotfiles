font=JetBrainsMono NF:size=16
pad=8x8

[colors-dark]
foreground=00cc33        # matrix green — the code that reads you
background=000a00        # digital black — the construct

## Normal colors
regular0=000a00          # digital black — absolute null
regular1=003a00          # dark forest — dormant process
regular2=004a10          # deep green — running thread
regular3=00cc33          # matrix green — active symbol
regular4=003a18          # system black — memory void
regular5=007a20          # mid green — data stream
regular6=009930          # teal-green — subroutine
regular7=00cc33          # matrix green — output line

## Bright colors
bright0=001400           # raised null — cold boot
bright1=006600           # vivid dark green — compiled
bright2=00a020           # rich green — execution burst
bright3=00ff41           # neon green — full signal
bright4=003000           # clear system — allocated
bright5=00b030           # bright stream — live feed
bright6=00dd50           # medium-bright — data pulse
bright7=88ffaa           # near white green — peak signal

## Dimmed colors
dim0=000500              # buried null — unallocated
dim1=001a00              # dim forest — sleeping process
dim2=002010              # dim thread — idle subroutine
dim3=001800              # dim stream — low bandwidth

alpha=0.92
