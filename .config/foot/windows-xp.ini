font=JetBrainsMono NF:size=15
pad=8x8

[colors-dark]
foreground=f0faff        # cloud white — the bright sky
background=0a1f12        # hill shadow — grass in shade

## Normal colors
regular0=0a1f12          # hill shadow — grass in shade
regular1=ff6b4a          # warm sun accent — rare highlight
regular2=124a20          # deep grass — hillside shadow
regular3=4a9fdb          # sky blue — cloudless horizon
regular4=1f5fde          # Luna blue — the title-bar accent
regular5=6ab0dc          # muted sky blue — hazy distance
regular6=2f8f3f          # grass green — sunlit hillside
regular7=f0faff          # cloud white — text on daylight

## Bright colors
bright0=163a1e           # lifted hill shadow
bright1=ff8a68           # bright sun accent
bright2=1e8a38           # bright grass — vivid green
bright3=8fe0ff           # brilliant sky — peak daylight
bright4=2aa848           # clear grass green
bright5=a8ecff           # bright sky highlight
bright6=3fc058           # medium-bright grass
bright7=ffffff           # pure white — brightest cloud

## Dimmed colors
dim0=05100a              # deepest shadow — dusk on the hill
dim1=6a2c1c              # dim sun accent
dim2=0a2812              # dim grass
dim3=0a2c3a              # dim sky — overcast

alpha=1.0
