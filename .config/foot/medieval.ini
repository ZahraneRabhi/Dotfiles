font=JetBrainsMono NF:size=16
pad=8x8

[colors-dark]
foreground=f1dfc4        # warm parchment cream
background=24180f        # deep antique brown

## Normal colors
regular0=140d09          # darkest shadow brown
regular1=7b3f2a          # earthy terracotta red
regular2=6f5a3d          # muted olive-brown
regular3=b88a57          # warm golden bronze
regular4=6e7f8f          # dusty stone blue
regular5=9b7a5f          # faded clay brown
regular6=8e6d49          # aged wood brown
regular7=dbc5a3          # soft parchment beige

## Bright colors
bright0=3d2b20           # lifted dark brown
bright1=a35a3b           # brighter terracotta
bright2=92724d           # warm muted gold-brown
bright3=d1a166           # rich antique gold
bright4=92a7ba           # pale weathered blue
bright5=c09a79           # warm sandstone
bright6=b28b61           # faded bronze
bright7=f5e6d3           # bright parchment white

## Dimmed colors
dim0=0b0705              # near-black brown
dim1=4e271b              # muted dark terracotta

alpha=0.1                # semi-transparent glassy effect

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh

[csd]
preferred=server
color=24180f
border-width=2
button-color=f1dfc4
button-minimize-color=b88a57
button-maximize-color=92724d
button-close-color=7b3f2a