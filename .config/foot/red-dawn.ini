font=JetBrainsMono NF:size=15
pad=8x8

[colors-dark]
foreground=fff2c9        # gold white — sunburst rays
background=1a0505        # near-black red — the deep background

## Normal colors
regular0=1a0505          # near-black red — background between flags
regular1=b81c1c          # flag red — the crowd's banners
regular2=5c0f0f          # deep maroon — shadowed folds
regular3=ffcc33          # bright gold — the sunburst core
regular4=8a1414          # mid red — banner shadow
regular5=d4a83a          # muted gold — dimmer rays
regular6=a02020          # medium red — flag cloth
regular7=fff2c9          # gold white — text in sunlight

## Bright colors
bright0=3d0a0a           # lifted background red
bright1=e83030           # bright red — vivid banner
bright2=8a2020           # bright maroon
bright3=ffe066           # brilliant gold — peak sunburst
bright4=c02828           # clear red
bright5=ffd966           # bright gold — warm highlight
bright6=d03838           # medium-bright red
bright7=fffaf0           # near white — brightest ray

## Dimmed colors
dim0=0d0202              # deepest red — no light remains
dim1=5c1212              # dim red — memory of the flag
dim2=2e0808              # dim maroon
dim3=4a3010              # dim gold — fading sunburst

alpha=0.94
