font=JetBrainsMono NF:size=16
pad=8x8

[colors-dark]
foreground=f2c900        # neon yellow — luminous data light
background=050b10        # deep dark teal — night city abyss

## Normal colors-dark
regular0=050505          # pure black — void depth
regular1=bba600          # muted amber — soft energy tone
regular2=00fff9          # cyan — neural spark
regular3=f2c900          # electric yellow — main highlight
regular4=d9b600          # gold — reflective circuitry
regular5=ccff66          # acid green — data scan glow
regular6=66fff9          # pale cyan — interface glow
regular7=e6e6e6          # light gray — UI text clarity

## Bright colors-dark
bright0=0a141a           # deep teal — metallic shadow
bright1=fad400           # bright yellow — strong cyber accent
bright2=00fff9           # bright cyan — electric pulse
bright3=fff065           # vivid neon yellow — highlight
bright4=cdfc5a           # lime — plasma hue
bright5=ccff99           # soft green-yellow — glow tint
bright6=99fff9           # pale cyan — cool tone
bright7=ffffff           # pure white — full brightness

## Dimmed colors-dark
dim0=000000              # void black — backdrop depth
dim1=665c00              # dark amber — muted reflection
dim2=003340              # dim cyan — soft pulse
dim3=555000              # dull gold — ambient dim light

alpha=0.01               # increased transparency — floating neon glass
