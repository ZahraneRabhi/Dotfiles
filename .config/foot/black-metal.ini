font=JetBrainsMono NF:size=14
pad=8x8

[colors-dark]
foreground=e8e8e8        # ink white — the pale line
background=060606        # true black — the void between lines

## Normal colors
regular0=060606          # true black — the void between lines
regular1=8a1515          # blood accent — the one color
regular2=2a2a2a          # ink shadow — dark cross-hatch
regular3=8a8a8a          # grey — mid-tone hatching
regular4=3a3a3a          # dark grey — deeper hatch
regular5=a0a0a0          # light grey — sparse hatch
regular6=5a5a5a          # medium grey — mid hatch
regular7=e8e8e8          # ink white — text on the page

## Bright colors
bright0=1a1a1a           # lifted black — faint hatch
bright1=b02020           # bright blood accent
bright2=4a4a4a           # bright ink shadow
bright3=c8c8c8           # bright grey — highlight hatch
bright4=606060           # clear grey
bright5=d8d8d8           # bright light grey
bright6=808080           # medium-bright grey
bright7=ffffff           # pure white — brightest line

## Dimmed colors
dim0=020202              # deepest black — no ink remains
dim1=4a0c0c              # dim blood accent
dim2=141414              # dim ink shadow
dim3=1e1e1e              # dim grey — faded hatch

alpha=0.96
