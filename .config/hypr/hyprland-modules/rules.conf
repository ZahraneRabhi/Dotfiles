# Window & Workspace rules

# Chrome apps rules
windowrule = tile on, rounding 10, border_size 2, match:class ^(Chromium)$


# Wofi rules
# by default wofi spawns as a layer-shel and blocks all inputs once its executed
# which makes the rest of the env unresponsive
# the solution was to make hyprland consider it like a normal floating windows
windowrule = float on, center on, size (monitor_w*0.6) (monitor_h*0.5), match:class ^(wofi)$


# Float and center the terminal running nmtui
# Float and center the nmtui popup
windowrule = float on, size 800 600, center on, match:class ^(foot)$, match:title .*nmtui.*
windowrule = match:class ^(Recordly)$, float on, pin on, no_blur yes
