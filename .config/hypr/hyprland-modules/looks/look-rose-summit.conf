############################################
### ROSE SUMMIT — AURORA PEAK SNOWFIELD ###
############################################

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(d060a0cc)   # aurora rose — the ribbon of light
    col.inactive_border = rgba(08061844) # midnight navy — base of the mountain
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.88
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 22
        render_power = 4
        color = rgba(08061899)
    }

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.16
    }
}

animations {
    enabled = yes
    bezier = aurora,0.1,0.85,0.15,1
    bezier = snowfall,0.4,0,0.5,0.1
    bezier = peak,0.05,0.95,0.1,1
    bezier = drift,0.3,0.7,0.3,1

    animation = global, 1, 13, aurora
    animation = border, 1, 11, drift
    animation = windows, 1, 10.0, aurora
    animation = windowsIn, 1, 6.5, peak, popin 83%
    animation = windowsOut, 1, 3.0, snowfall, popin 83%
    animation = fadeIn, 1, 4.5, peak
    animation = fadeOut, 1, 2.5, snowfall
    animation = layers, 1, 7.5, aurora
    animation = layersIn, 1, 6.5, peak, fade
    animation = layersOut, 1, 2.5, snowfall, fade
    animation = workspaces, 1, 4.5, drift, fade
    animation = workspacesIn, 1, 3.5, peak, fade
    animation = workspacesOut, 1, 4.5, drift, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 10
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Midnight Navy     : #080618  (pre-dawn sky)
# Aurora Rose       : #d060a0  (the ribbon)
# Pale Lavender Snow: #e0d0f0  (snowfield)
# Bright Pink       : #f080c0  (aurora peak)
# Midnight Indigo   : #4c3870  (mountain shadow)
###############################
