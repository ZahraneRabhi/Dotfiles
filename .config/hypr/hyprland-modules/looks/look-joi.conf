############################################
### JOI — BLADE RUNNER 2049 HOLOGRAM   ###
############################################

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(d060c8cc)   # holo pink — projection edge
    col.inactive_border = rgba(18083044) # deep purple night — city dark
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 0.87
    inactive_opacity = 0.70
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 22
        render_power = 4
        color = rgba(18083099)
    }

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.22
    }
}

animations {
    enabled = yes
    bezier = flicker,0.1,1.2,0.2,0.9
    bezier = static,0.3,0,0.5,0.1
    bezier = project,0.0,0.9,0.1,1
    bezier = scan,0,0,1,1

    animation = global, 1, 9, project
    animation = border, 1, 7, scan
    animation = windows, 1, 6.5, project
    animation = windowsIn, 1, 4.0, flicker, popin 78%
    animation = windowsOut, 1, 2.0, static, popin 78%
    animation = fadeIn, 1, 3.5, project
    animation = fadeOut, 1, 1.8, static
    animation = layers, 1, 5.5, project
    animation = layersIn, 1, 4.5, flicker, fade
    animation = layersOut, 1, 2.0, static, fade
    animation = workspaces, 1, 3.5, scan, fade
    animation = workspacesIn, 1, 2.5, flicker, fade
    animation = workspacesOut, 1, 3.5, scan, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 8
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Deep Purple Night : #180830  (rain-soaked city)
# Holo Pink         : #d060c8  (her outline)
# Electric Blue     : #4090ff  (neon reflection)
# Holographic White : #d8d0f8  (projected light)
# Neon Magenta      : #a040c0  (billboard shimmer)
###############################
