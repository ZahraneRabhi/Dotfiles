############################################
### LUNAR CRESCENT — VOID AND MOONLIGHT ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(888888cc)   # silver — illuminated crater rim
    col.inactive_border = rgba(22222244) # deep shadow — far side of the moon
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(00000099)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.12
    }
}

animations {
    enabled = yes
    bezier = orbit,0.2,0.8,0.2,1
    bezier = eclipse,0.5,0,0.6,0.05
    bezier = rise,0.1,0.9,0.15,1
    bezier = phase,0.3,0.6,0.3,1

    animation = global, 1, 12, orbit
    animation = border, 1, 10, phase
    animation = windows, 1, 9.0, orbit
    animation = windowsIn, 1, 6.0, rise, popin 82%
    animation = windowsOut, 1, 2.8, eclipse, popin 82%
    animation = fadeIn, 1, 4.0, rise
    animation = fadeOut, 1, 2.5, eclipse
    animation = layers, 1, 7.0, orbit
    animation = layersIn, 1, 6.0, rise, fade
    animation = layersOut, 1, 2.5, eclipse, fade
    animation = workspaces, 1, 4.5, phase, fade
    animation = workspacesIn, 1, 3.0, rise, fade
    animation = workspacesOut, 1, 4.5, phase, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 8
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Absolute Void  : #000000  (the universe between)
# Cold Moonlight : #e0e0e0  (lit face)
# Silver         : #888888  (crater rim)
# Deep Shadow    : #222222  (far side)
# Bright Silver  : #cccccc  (albedo peak)
###############################
