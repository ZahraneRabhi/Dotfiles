############################################
### THE CARTOGRAPHER — MAP OF OLD WORLDS ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(8a6a3ccc)   # faded ochre — compass rose line
    col.inactive_border = rgba(3d251044) # dark ink — unmarked territory
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2
    active_opacity = 0.92
    inactive_opacity = 0.78
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(1e120899)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.16
    }
}

animations {
    enabled = yes
    bezier = scroll,0.2,0.8,0.15,1
    bezier = fold,0.5,0,0.4,0.1
    bezier = unfurl,0.1,0.85,0.2,1
    bezier = study,0.3,0.7,0.3,1

    animation = global, 1, 11, scroll
    animation = border, 1, 9, study
    animation = windows, 1, 8.0, scroll
    animation = windowsIn, 1, 5.5, unfurl, popin 85%
    animation = windowsOut, 1, 2.8, fold, popin 85%
    animation = fadeIn, 1, 4.0, unfurl
    animation = fadeOut, 1, 2.5, fold
    animation = layers, 1, 6.5, scroll
    animation = layersIn, 1, 5.5, unfurl, fade
    animation = layersOut, 1, 2.5, fold, fade
    animation = workspaces, 1, 4.0, study, fade
    animation = workspacesIn, 1, 3.0, unfurl, fade
    animation = workspacesOut, 1, 4.0, study, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 6
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
