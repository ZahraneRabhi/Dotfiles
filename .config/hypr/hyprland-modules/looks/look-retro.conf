###########################################
### MOONLIGHT TRANSFORMATION — SAILOR FX ###
###########################################

general {
    gaps_in = 8
    gaps_out = 18
    border_size = 3
    col.active_border = rgba(ff4d8fff)   # Moon pink — magical girl pulse
    col.inactive_border = rgba(5a4aaa55) # Cosmic iris — dormant sailor haze
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 18
    rounding_power = 3
    active_opacity = 0.92
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 5
        color = rgba(ff4d8f55)  # Moon pink diffuse — magical sparkle aura
    }

    blur {
        enabled = true
        size = 7
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.52  # dreamy retro glow saturation
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = sparkle,0.34,1.56,0.64,1
    bezier = moonrise,0.12,0.8,0.2,1

    animation = global, 1, 9, easeOutQuint
    animation = border, 1, 6, sparkle
    animation = windows, 1, 5.5, sparkle
    animation = windowsIn, 1, 4.0, sparkle, popin 75%
    animation = windowsOut, 1, 2.0, moonrise, popin 75%
    animation = fadeIn, 1, 2.5, moonrise
    animation = fadeOut, 1, 1.8, easeOutQuint
    animation = layers, 1, 4.2, easeOutQuint
    animation = layersIn, 1, 4.5, sparkle, fade
    animation = layersOut, 1, 2.0, moonrise, fade
    animation = workspaces, 1, 2.8, easeInOutCubic, slidevert
    animation = workspacesIn, 1, 2.0, sparkle, slidevert
    animation = workspacesOut, 1, 2.8, easeInOutCubic, slidevert
}

# === Chrome / Electron Apps Polishing ===
windowrule {
  name = windowrule-1
  tile = on
  rounding = 18
  border_size = 3
  match:class = ^(Chromium|Brave|code)$
}

# === Layouts ===
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# === Misc Settings ===
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

