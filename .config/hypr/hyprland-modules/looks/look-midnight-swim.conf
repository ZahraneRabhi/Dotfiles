############################################
### MIDNIGHT SWIM — SUBMERGED CALM      ###
############################################

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(1f7a8ccc)   # glowing teal — moonlit ripple
    col.inactive_border = rgba(0d344488) # deep teal shadow — the pool floor
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.74
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 26
        render_power = 3
        color = rgba(07162099)
    }

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.20
    }
}

animations {
    enabled = yes
    bezier = drift,0.13,0.75,0.15,1
    bezier = surface,0.3,0.9,0.2,1
    bezier = sink,0.5,0,0.7,0.15
    bezier = ripple,0.22,0.75,0.3,1

    animation = global, 1, 14, drift
    animation = border, 1, 11, ripple
    animation = windows, 1, 10.0, drift
    animation = windowsIn, 1, 6.5, surface, popin 85%
    animation = windowsOut, 1, 3.5, sink, popin 85%
    animation = fadeIn, 1, 5.0, surface
    animation = fadeOut, 1, 2.8, sink
    animation = layers, 1, 7.5, drift
    animation = layersIn, 1, 6.0, surface, fade
    animation = layersOut, 1, 2.8, sink, fade
    animation = workspaces, 1, 4.5, drift, fade
    animation = workspacesIn, 1, 3.2, surface, fade
    animation = workspacesOut, 1, 4.5, drift, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 14
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Deep Navy    : #071620  (the pool depths)
# Ice Cyan     : #cfeef0  (moonlight on skin)
# Glow Teal    : #1f7a8c  (lit water)
