############################################
### EAGLE NEBULA — PILLARS OF CREATION ###
############################################

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(2a8a80cc)   # nebula teal — ionized gas glow
    col.inactive_border = rgba(04081044) # space black — outer void
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 0.87
    inactive_opacity = 0.70
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 26
        render_power = 4
        color = rgba(04081099)
    }

    blur {
        enabled = true
        size = 9
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.18
    }
}

animations {
    enabled = yes
    bezier = drift,0.15,0.85,0.2,1
    bezier = disperse,0.5,0,0.6,0.05
    bezier = condense,0.05,0.95,0.1,1
    bezier = cosmic,0.3,0.7,0.3,1

    animation = global, 1, 14, drift
    animation = border, 1, 12, cosmic
    animation = windows, 1, 11.0, drift
    animation = windowsIn, 1, 7.0, condense, popin 80%
    animation = windowsOut, 1, 3.5, disperse, popin 80%
    animation = fadeIn, 1, 5.0, condense
    animation = fadeOut, 1, 3.0, disperse
    animation = layers, 1, 8.5, drift
    animation = layersIn, 1, 7.0, condense, fade
    animation = layersOut, 1, 3.0, disperse, fade
    animation = workspaces, 1, 5.5, cosmic, fade
    animation = workspacesIn, 1, 4.0, condense, fade
    animation = workspacesOut, 1, 5.5, cosmic, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 8
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Space Black   : #040810  (cosmic vacuum)
# Nebula Teal   : #2a8a80  (ionized gas)
# Cosmic Rust   : #c05830  (iron-rich dust)
# Nebula Frost  : #d8ede8  (cloud surface)
# Sage Nebula   : #608070  (oxygen emission)
