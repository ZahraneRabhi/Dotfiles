############################################
### INDIGO PETAL — MACRO DARK FLOWER    ###
############################################

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    col.active_border = rgba(6a5fc0cc)   # medium indigo — petal vein lit
    col.inactive_border = rgba(3d358044) # muted indigo — shadow fold
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 3
    active_opacity = 0.88
    inactive_opacity = 0.70
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 4
        color = rgba(0d0b1499)
    }

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.14
    }
}

animations {
    enabled = yes
    bezier = bloom,0.0,0.8,0.2,1
    bezier = wilt,0.6,0,0.8,0.1
    bezier = drift,0.3,0.6,0.4,1
    bezier = settle,0.2,0.9,0.1,1

    animation = global, 1, 14, bloom
    animation = border, 1, 12, drift
    animation = windows, 1, 10.0, bloom
    animation = windowsIn, 1, 7.0, settle, popin 85%
    animation = windowsOut, 1, 3.5, wilt, popin 85%
    animation = fadeIn, 1, 5.0, settle
    animation = fadeOut, 1, 3.0, wilt
    animation = layers, 1, 8.0, bloom
    animation = layersIn, 1, 7.0, settle, fade
    animation = layersOut, 1, 3.0, wilt, fade
    animation = workspaces, 1, 5.0, drift, fade
    animation = workspacesIn, 1, 4.0, settle, fade
    animation = workspacesOut, 1, 5.0, drift, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 12
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Near-black Indigo: #0d0b14  (petal depth)
# Medium Indigo   : #6a5fc0  (petal vein)
# Soft Lavender   : #c4bcf0  (petal edge)
# Deep Violet     : #3d3580  (fold shadow)
# Grape Violet    : #8050a8  (inner bloom)
###############################
