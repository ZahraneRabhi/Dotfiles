##########################################
### THE WANDERER'S ROAD — PLEIN AIR    ###
##########################################

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(c8a040bb)   # Harvest gold — afternoon sun edge
    col.inactive_border = rgba(7a9ab044) # Slate sky — cool distant border
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.94
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(3a3020aa)  # Warm earth — soft ground shadow
    }

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.28  # warm afternoon air diffusion
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = meadow,0.25,1.0,0.5,1
    bezier = drift,0.4,0.05,0.2,1

    animation = global, 1, 11, easeOutQuint
    animation = border, 1, 8, meadow
    animation = windows, 1, 7.5, meadow
    animation = windowsIn, 1, 5.0, meadow, slide
    animation = windowsOut, 1, 3.0, drift, slide
    animation = fadeIn, 1, 3.5, meadow
    animation = fadeOut, 1, 2.5, drift
    animation = layers, 1, 5.0, easeOutQuint
    animation = layersIn, 1, 5.5, meadow, fade
    animation = layersOut, 1, 2.8, drift, fade
    animation = workspaces, 1, 3.2, easeInOutCubic, slide
    animation = workspacesIn, 1, 2.2, meadow, slide
    animation = workspacesOut, 1, 3.2, easeInOutCubic, slide
}

# === Chrome / Electron Apps Polishing ===
windowrule {
  name = windowrule-1
  tile = on
  rounding = 10
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

# === Layouts ===
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# === Misc Settings ===
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
