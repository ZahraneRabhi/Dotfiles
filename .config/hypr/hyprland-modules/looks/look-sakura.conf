############################################
### SAKURA BLADE — AUTUMN BATTLEFIELD  ###
############################################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(d09040cc)   # sakura gold — petal caught in light
    col.inactive_border = rgba(10080644) # dark earth — the ancient road
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.74
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(10080699)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.18
    }
}

animations {
    enabled = yes
    bezier = katana,0.05,0.85,0.1,1
    bezier = sheath,0.5,0,0.4,0.1
    bezier = blossom,0.2,0.9,0.15,1
    bezier = fall,0.3,0.6,0.4,1

    animation = global, 1, 8, katana
    animation = border, 1, 6, fall
    animation = windows, 1, 6.5, katana
    animation = windowsIn, 1, 4.0, blossom, popin 80%
    animation = windowsOut, 1, 2.0, sheath, popin 80%
    animation = fadeIn, 1, 3.0, blossom
    animation = fadeOut, 1, 1.8, sheath
    animation = layers, 1, 5.5, katana
    animation = layersIn, 1, 4.5, blossom, fade
    animation = layersOut, 1, 1.8, sheath, fade
    animation = workspaces, 1, 3.5, fall, fade
    animation = workspacesIn, 1, 2.5, blossom, fade
    animation = workspacesOut, 1, 3.5, fall, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 6
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Dark Earth   : #100806  (ancient battlefield road)
# Sakura Gold  : #d09040  (caught petal in light)
# Warm Ivory   : #f0ddc8  (ancestral paper)
# Autumn Ember : #e06030  (dying tree fire)
# Burnt Sienna : #a06030  (bark and blood)
###############################
