############################################
### WARP SPEED — SOLAR LIGHT BURST     ###
############################################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(f8a000cc)   # solar gold — light ring at max speed
    col.inactive_border = rgba(06020444) # deepest void — before ignition
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 5
        color = rgba(06020499)
    }

    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.25
    }
}

animations {
    enabled = yes
    bezier = ignite,0.0,1.0,0.05,1
    bezier = exhaust,0.6,0,0.9,0
    bezier = burn,0.05,0.95,0.1,1
    bezier = streak,0,0,0.5,1

    animation = global, 1, 5, ignite
    animation = border, 1, 4, streak
    animation = windows, 1, 3.5, ignite
    animation = windowsIn, 1, 2.0, burn, popin 70%
    animation = windowsOut, 1, 1.0, exhaust, popin 70%
    animation = fadeIn, 1, 1.5, burn
    animation = fadeOut, 1, 0.8, exhaust
    animation = layers, 1, 3.0, ignite
    animation = layersIn, 1, 2.0, burn, fade
    animation = layersOut, 1, 1.0, exhaust, fade
    animation = workspaces, 1, 2.0, streak, fade
    animation = workspacesIn, 1, 1.5, burn, fade
    animation = workspacesOut, 1, 2.0, streak, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 6
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Deepest Void  : #060204  (before the burn)
# Solar Gold    : #f8a000  (accretion disc)
# Plasma Burst  : #ff6020  (ring ignition)
# Warm Light    : #ffe8c8  (event horizon)
# Ember Orange  : #c04000  (cooling plasma)
