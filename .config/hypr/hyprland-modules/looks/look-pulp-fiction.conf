############################################
### PULP FICTION — FILM NOIR GOLD/BLACK ###
############################################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(e8a020cc)   # golden orange — neon diner sign
    col.inactive_border = rgba(18181844) # noir black — shadow between cuts
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2
    active_opacity = 0.93
    inactive_opacity = 0.76
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(18181899)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.20
    }
}

animations {
    enabled = yes
    bezier = cut,0.05,0.8,0.1,1
    bezier = smash,0.4,0,0.1,1
    bezier = snap,0.1,0.95,0.15,1
    bezier = noir,0.3,0.5,0.4,1

    animation = global, 1, 7, cut
    animation = border, 1, 5, snap
    animation = windows, 1, 4.5, cut
    animation = windowsIn, 1, 3.0, snap, popin 80%
    animation = windowsOut, 1, 1.5, smash, popin 80%
    animation = fadeIn, 1, 2.0, snap
    animation = fadeOut, 1, 1.2, smash
    animation = layers, 1, 3.5, cut
    animation = layersIn, 1, 3.0, snap, fade
    animation = layersOut, 1, 1.5, smash, fade
    animation = workspaces, 1, 2.5, noir, fade
    animation = workspacesIn, 1, 1.8, snap, fade
    animation = workspacesOut, 1, 2.5, noir, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 4
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Film Noir Black : #181818  (the diner at night)
# Golden Orange   : #e8a020  (neon sign)
# Warm Amber-Gold : #f0d080  (spotlight)
# Deep Red        : #c03020  (blood on the floor)
# Dark Charcoal   : #2a2828  (rainy street)
###############################
