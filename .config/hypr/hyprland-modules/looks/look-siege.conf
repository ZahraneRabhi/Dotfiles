############################################
### THE SIEGE THAT NEVER ENDS — WAR INK  ###
############################################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(d8d0c8cc)   # Engraving white — illuminated blade edge
    col.inactive_border = rgba(48404033) # Chaos smoke — smothered border
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 3
    rounding_power = 2
    active_opacity = 0.93
    inactive_opacity = 0.78
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 6
        color = rgba(101010ee)  # Void ink — absolute crosshatch darkness
    }

    blur {
        enabled = true
        size = 4
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.06  # near-zero — monochrome ink has no saturation
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = siege,0.05,0.85,0.1,1
    bezier = rout,0.7,0,0.9,0.1

    animation = global, 1, 13, easeOutQuint
    animation = border, 1, 11, siege
    animation = windows, 1, 9.5, siege
    animation = windowsIn, 1, 7.0, siege, popin 95%
    animation = windowsOut, 1, 2.5, rout, popin 95%
    animation = fadeIn, 1, 4.5, siege
    animation = fadeOut, 1, 2.0, rout
    animation = layers, 1, 7.0, easeOutQuint
    animation = layersIn, 1, 7.5, siege, fade
    animation = layersOut, 1, 2.2, rout, fade
    animation = workspaces, 1, 4.0, easeInOutCubic, slide
    animation = workspacesIn, 1, 3.0, siege, slide
    animation = workspacesOut, 1, 4.0, easeInOutCubic, slide
}

# === Chrome / Electron Apps Polishing ===
windowrule {
  name = windowrule-1
  tile = on
  rounding = 3
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

# === Layouts ===
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# === Misc Settings ===
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

