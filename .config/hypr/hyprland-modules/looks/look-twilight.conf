############################################
### TWILIGHT REVERIE — DUSK SILHOUETTE  ###
############################################

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(c17da8cc)   # dusty rose mauve — horizon blush
    col.inactive_border = rgba(5e3d7844) # deep dusk violet — tree silhouette
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.88
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(150f2099)
    }

    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.16
    }
}

animations {
    enabled = yes
    bezier = dusk,0.1,0.8,0.2,1
    bezier = fade,0.5,0,0.7,0.1
    bezier = breath,0.25,0.7,0.3,1
    bezier = dim,0.4,0,0.6,0.05

    animation = global, 1, 13, dusk
    animation = border, 1, 10, breath
    animation = windows, 1, 9.0, dusk
    animation = windowsIn, 1, 6.0, breath, popin 82%
    animation = windowsOut, 1, 3.0, dim, popin 82%
    animation = fadeIn, 1, 4.5, breath
    animation = fadeOut, 1, 2.5, fade
    animation = layers, 1, 7.0, dusk
    animation = layersIn, 1, 6.0, breath, fade
    animation = layersOut, 1, 2.5, dim, fade
    animation = workspaces, 1, 4.0, dusk, fade
    animation = workspacesIn, 1, 3.0, breath, fade
    animation = workspacesOut, 1, 4.0, dusk, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 10
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

