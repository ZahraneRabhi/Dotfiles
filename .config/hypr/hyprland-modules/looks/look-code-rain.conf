############################################
### CODE RAIN — THE MATRIX CONSTRUCT   ###
############################################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
    col.active_border = rgba(00ff41cc)   # neon green — active symbol cascade
    col.inactive_border = rgba(003010aa) # deep green — dormant process
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.75
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(000a0099)
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.24
    }
}

animations {
    enabled = yes
    bezier = cascade,0.0,1.0,0.1,1
    bezier = dissolve,0.4,0,0.6,0
    bezier = compile,0.05,0.9,0.1,1
    bezier = stream,0,0,1,1

    animation = global, 1, 6, cascade
    animation = border, 1, 4, stream
    animation = windows, 1, 4.0, cascade
    animation = windowsIn, 1, 2.5, compile, popin 70%
    animation = windowsOut, 1, 1.2, dissolve, popin 70%
    animation = fadeIn, 1, 1.8, compile
    animation = fadeOut, 1, 1.0, dissolve
    animation = layers, 1, 3.5, cascade
    animation = layersIn, 1, 2.5, compile, fade
    animation = layersOut, 1, 1.0, dissolve, fade
    animation = workspaces, 1, 2.0, stream, fade
    animation = workspacesIn, 1, 1.5, compile, fade
    animation = workspacesOut, 1, 2.0, stream, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 2
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

