############################################
### BLACK METAL — NECRO INK             ###
############################################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(e8e8e8cc)   # off-white ink — the pale line
    col.inactive_border = rgba(1a1a1a99) # black — the void between lines
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2
    active_opacity = 0.96
    inactive_opacity = 0.82
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(000000a0)
    }

    blur {
        enabled = true
        size = 2
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.04
    }
}

animations {
    enabled = yes
    bezier = etch,0.08,0.92,0.05,1
    bezier = smear,0.6,0,0.8,0.0
    bezier = carve,0.02,0.96,0.05,1
    bezier = still,0.3,0.68,0.4,1

    animation = global, 1, 10, etch
    animation = border, 1, 9, still
    animation = windows, 1, 8.0, etch
    animation = windowsIn, 1, 5.0, carve, popin 74%
    animation = windowsOut, 1, 2.2, smear, popin 74%
    animation = fadeIn, 1, 3.8, carve
    animation = fadeOut, 1, 1.8, smear
    animation = layers, 1, 6.0, etch
    animation = layersIn, 1, 4.8, carve, fade
    animation = layersOut, 1, 1.8, smear, fade
    animation = workspaces, 1, 3.5, still, fade
    animation = workspacesIn, 1, 2.6, carve, fade
    animation = workspacesOut, 1, 3.5, still, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 0
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# True Black   : #060606  (the void between lines)
# Ink White    : #e8e8e8  (the pale line)
# Grey         : #8a8a8a  (mid-tone hatching)
# Ink Shadow    : #2a2a2a (dark cross-hatch)
# Blood Accent : #8a1515  (urgent only — the one color)
###############################
