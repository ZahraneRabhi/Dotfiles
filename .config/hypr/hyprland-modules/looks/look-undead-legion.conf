############################################
### UNDEAD LEGION — SKELETON ARMY MARCH ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(6a5590cc)   # cold purple — spectral armor glow
    col.inactive_border = rgba(3d2d5a44) # grave violet — shadow of dead
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2
    active_opacity = 0.86
    inactive_opacity = 0.70
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 22
        render_power = 5
        color = rgba(06040e99)
    }

    blur {
        enabled = true
        size = 6
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.12
    }
}

animations {
    enabled = yes
    bezier = march,0.1,0.9,0.05,1
    bezier = collapse,0.5,0,0.7,0.05
    bezier = rise,0.0,0.95,0.1,1
    bezier = fall,0.6,0,0.8,0.0

    animation = global, 1, 14, march
    animation = border, 1, 11, rise
    animation = windows, 1, 10.0, march
    animation = windowsIn, 1, 6.5, rise, popin 78%
    animation = windowsOut, 1, 2.5, fall, popin 78%
    animation = fadeIn, 1, 4.0, rise
    animation = fadeOut, 1, 2.0, collapse
    animation = layers, 1, 7.0, march
    animation = layersIn, 1, 6.0, rise, fade
    animation = layersOut, 1, 2.0, fall, fade
    animation = workspaces, 1, 4.5, march, fade
    animation = workspacesIn, 1, 3.0, rise, fade
    animation = workspacesOut, 1, 4.5, march, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 4
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

