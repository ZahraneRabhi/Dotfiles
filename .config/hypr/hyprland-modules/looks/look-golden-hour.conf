############################################
### GOLDEN HOUR — MOUNTAIN AMBER DUSK  ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(e08020cc)   # amber gold — upper atmosphere glow
    col.inactive_border = rgba(0a080644) # charcoal black — valley in shadow
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.74
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(0a080699)
    }

    blur {
        enabled = true
        size = 7
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.20
    }
}

animations {
    enabled = yes
    bezier = warmth,0.2,0.85,0.2,1
    bezier = cool,0.5,0,0.6,0.1
    bezier = horizon,0.1,0.9,0.15,1
    bezier = layer,0.3,0.7,0.3,1

    animation = global, 1, 11, warmth
    animation = border, 1, 9, layer
    animation = windows, 1, 8.5, warmth
    animation = windowsIn, 1, 5.5, horizon, popin 82%
    animation = windowsOut, 1, 2.8, cool, popin 82%
    animation = fadeIn, 1, 4.0, horizon
    animation = fadeOut, 1, 2.5, cool
    animation = layers, 1, 6.5, warmth
    animation = layersIn, 1, 5.5, horizon, fade
    animation = layersOut, 1, 2.5, cool, fade
    animation = workspaces, 1, 4.0, layer, fade
    animation = workspacesIn, 1, 3.0, horizon, fade
    animation = workspacesOut, 1, 4.0, layer, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 8
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Charcoal Black : #0a0806  (silhouette base)
# Amber Gold     : #e08020  (upper atmosphere)
# Warm Peach-Gold: #f0ddb0  (direct light)
# Deep Orange    : #ff6020  (solar disc)
# Dark Rust      : #804010  (fading treeline)
###############################
