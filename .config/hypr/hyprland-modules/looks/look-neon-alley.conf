############################################
### NEON ALLEY — CYBERPUNK CITY NIGHT  ###
############################################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(c8d820cc)   # neon yellow — the lit sign above
    col.inactive_border = rgba(0a1a1844) # midnight teal — wet alley floor
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.74
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0a1a1899)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.24
    }
}

animations {
    enabled = yes
    bezier = strobe,0.0,1.2,0.1,0.8
    bezier = static,0.4,0,0.5,0.1
    bezier = pulse,0.05,0.9,0.1,1
    bezier = flicker,0.1,0.8,0.3,1

    animation = global, 1, 6, pulse
    animation = border, 1, 4, flicker
    animation = windows, 1, 5.0, pulse
    animation = windowsIn, 1, 3.0, strobe, popin 76%
    animation = windowsOut, 1, 1.5, static, popin 76%
    animation = fadeIn, 1, 2.5, pulse
    animation = fadeOut, 1, 1.2, static
    animation = layers, 1, 4.0, pulse
    animation = layersIn, 1, 3.0, strobe, fade
    animation = layersOut, 1, 1.5, static, fade
    animation = workspaces, 1, 2.5, flicker, fade
    animation = workspacesIn, 1, 2.0, strobe, fade
    animation = workspacesOut, 1, 2.5, flicker, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 4
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Midnight Teal   : #0a1a18  (wet city alley)
# Neon Yellow     : #c8d820  (the lit sign)
# Electric Cyan   : #20d0a0  (data strip)
# Cold Neon White : #e8f0e0  (billboard text)
# Warning Red     : #d42020  (danger sign)
###############################
