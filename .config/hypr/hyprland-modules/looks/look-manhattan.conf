############################################
### DR. MANHATTAN — BEYOND MORTALITY   ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(3060d0cc)   # god-energy blue — nuclear luminance
    col.inactive_border = rgba(04000c44) # cosmic void — outside time
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 3
    active_opacity = 0.88
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 5
        color = rgba(04000c99)
    }

    blur {
        enabled = true
        size = 10
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.20
    }
}

animations {
    enabled = yes
    bezier = omnipotent,0.0,1.0,0.0,1
    bezier = quantum,0.5,0,0.4,0.05
    bezier = transcend,0.0,0.9,0.05,1
    bezier = perceive,0.2,0.8,0.2,1

    animation = global, 1, 11, omnipotent
    animation = border, 1, 9, perceive
    animation = windows, 1, 8.5, omnipotent
    animation = windowsIn, 1, 5.5, transcend, popin 85%
    animation = windowsOut, 1, 2.5, quantum, popin 85%
    animation = fadeIn, 1, 4.0, transcend
    animation = fadeOut, 1, 2.0, quantum
    animation = layers, 1, 6.5, omnipotent
    animation = layersIn, 1, 5.5, transcend, fade
    animation = layersOut, 1, 2.0, quantum, fade
    animation = workspaces, 1, 4.0, perceive, fade
    animation = workspacesIn, 1, 3.0, transcend, fade
    animation = workspacesOut, 1, 4.0, perceive, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 10
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
