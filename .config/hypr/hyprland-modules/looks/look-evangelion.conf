############################################
### EVANGELION — UNIT ACTIVATION RITE  ###
############################################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(a0a8b8cc)   # chrome silver — eva armor surface
    col.inactive_border = rgba(06040844) # void black — entry plug dark
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 0.92
    inactive_opacity = 0.76
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 16
        render_power = 4
        color = rgba(06040899)
    }

    blur {
        enabled = true
        size = 4
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.15
    }
}

animations {
    enabled = yes
    bezier = synch,0.05,0.9,0.1,1
    bezier = eject,0.5,0,0.6,0.0
    bezier = boot,0.0,0.95,0.05,1
    bezier = scan,0,0,1,1

    animation = global, 1, 7, synch
    animation = border, 1, 5, scan
    animation = windows, 1, 5.5, synch
    animation = windowsIn, 1, 3.5, boot, popin 75%
    animation = windowsOut, 1, 1.5, eject, popin 75%
    animation = fadeIn, 1, 2.5, boot
    animation = fadeOut, 1, 1.2, eject
    animation = layers, 1, 4.5, synch
    animation = layersIn, 1, 3.5, boot, fade
    animation = layersOut, 1, 1.5, eject, fade
    animation = workspaces, 1, 2.8, scan, fade
    animation = workspacesIn, 1, 2.0, boot, fade
    animation = workspacesOut, 1, 2.8, scan, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 2
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

