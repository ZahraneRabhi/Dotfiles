############################################
### RED DAWN — SUNBURST AND CROWD       ###
############################################

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(ffcc33cc)   # radiant gold — the sunburst
    col.inactive_border = rgba(3d0a0a88) # deep flag red — the crowd below
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 0.92
    inactive_opacity = 0.76
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 22
        render_power = 4
        color = rgba(b81c1c99)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.10
    }
}

animations {
    enabled = yes
    bezier = march,0.16,0.9,0.1,1
    bezier = rally,0.5,0,0.75,0.05
    bezier = raise,0.05,0.95,0.1,1
    bezier = wave,0.3,0.75,0.35,1

    animation = global, 1, 12, march
    animation = border, 1, 10, wave
    animation = windows, 1, 9.0, march
    animation = windowsIn, 1, 6.0, raise, popin 80%
    animation = windowsOut, 1, 3.0, rally, popin 80%
    animation = fadeIn, 1, 4.5, raise
    animation = fadeOut, 1, 2.2, rally
    animation = layers, 1, 7.0, march
    animation = layersIn, 1, 5.5, raise, fade
    animation = layersOut, 1, 2.2, rally, fade
    animation = workspaces, 1, 4.0, wave, fade
    animation = workspacesIn, 1, 3.0, raise, fade
    animation = workspacesOut, 1, 4.0, wave, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 2
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Deep Red     : #3d0a0a  (background between flags)
# Gold White   : #fff2c9  (sunburst rays)
# Flag Red     : #b81c1c  (the crowd's banners)
# Deep Maroon  : #5c0f0f  (shadowed folds)
# Bright Gold  : #ffcc33  (the sunburst core)
###############################
