############################################
### GOTHAM NOIR — ROOFTOP SILHOUETTE    ###
############################################

general {
    gaps_in = 4
    gaps_out = 9
    border_size = 2
    col.active_border = rgba(9c1c1ccc)   # dark red — the blood sky
    col.inactive_border = rgba(12040488) # black — the silhouette
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 2
    active_opacity = 0.94
    inactive_opacity = 0.78
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(1204049c)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.06
    }
}

animations {
    enabled = yes
    bezier = stalk,0.1,0.9,0.05,1
    bezier = vanish,0.65,0,0.85,0.0
    bezier = strike,0.0,0.97,0.02,1
    bezier = watch,0.3,0.7,0.4,1

    animation = global, 1, 10, stalk
    animation = border, 1, 9, watch
    animation = windows, 1, 8.0, stalk
    animation = windowsIn, 1, 5.0, strike, popin 72%
    animation = windowsOut, 1, 2.0, vanish, popin 72%
    animation = fadeIn, 1, 3.5, strike
    animation = fadeOut, 1, 1.5, vanish
    animation = layers, 1, 6.0, stalk
    animation = layersIn, 1, 4.5, strike, fade
    animation = layersOut, 1, 1.5, vanish, fade
    animation = workspaces, 1, 3.5, watch, fade
    animation = workspacesIn, 1, 2.5, strike, fade
    animation = workspacesOut, 1, 3.5, watch, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 0
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Near-Black   : #120404  (the silhouette)
# Pale Warm    : #f0dcd4  (rare moonlit edge)
# Dark Red     : #9c1c1c  (the blood sky)
# Deep Maroon  : #380c0c  (shadowed rooftop)
# Bright Red   : #d43030  (peak sky glow)
###############################
