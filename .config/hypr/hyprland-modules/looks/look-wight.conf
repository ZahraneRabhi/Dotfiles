#####################################
### THE BARROW-WIGHT — DARK FOREST ###
#####################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(8a9a96cc)   # Ash gray — mist edge glow
    col.inactive_border = rgba(2a4a4a55) # Deep teal — sunken fog border
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2
    active_opacity = 0.88
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(080c0e99)  # Void black — deep forest shadow
    }

    blur {
        enabled = true
        size = 6
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.18  # cold mist diffusion
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = creep,0.05,0.9,0.1,1
    bezier = wither,0.4,0,0.6,0.05

    animation = global, 1, 12, easeOutQuint
    animation = border, 1, 9, creep
    animation = windows, 1, 8.0, easeOutQuint
    animation = windowsIn, 1, 5.5, creep, popin 80%
    animation = windowsOut, 1, 2.4, wither, popin 80%
    animation = fadeIn, 1, 3.0, creep
    animation = fadeOut, 1, 2.0, wither
    animation = layers, 1, 5.0, easeOutQuint
    animation = layersIn, 1, 5.2, creep, fade
    animation = layersOut, 1, 2.2, wither, fade
    animation = workspaces, 1, 3.0, easeInOutCubic, fade
    animation = workspacesIn, 1, 2.0, easeInOutCubic, fade
    animation = workspacesOut, 1, 3.0, easeInOutCubic, fade
}

# === Chrome / Electron Apps Polishing ===
windowrule {
  name = windowrule-1
  tile = on
  rounding = 6
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

# === Layouts ===
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# === Misc Settings ===
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
