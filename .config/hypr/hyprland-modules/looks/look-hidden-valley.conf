############################################
### HIDDEN VALLEY — THROUGH THE ARCH    ###
############################################

general {
    gaps_in = 8
    gaps_out = 18
    border_size = 1
    col.active_border = rgba(5fa88fcc)   # misty teal-green — the far spires
    col.inactive_border = rgba(21362e66) # deep forest shadow — under the arch
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 16
    rounding_power = 2
    active_opacity = 0.88
    inactive_opacity = 0.70
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 28
        render_power = 3
        color = rgba(0d1a1690)
    }

    blur {
        enabled = true
        size = 9
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.22
    }
}

animations {
    enabled = yes
    bezier = mist,0.15,0.8,0.15,1
    bezier = fade_out,0.45,0,0.65,0.15
    bezier = emerge,0.08,0.9,0.12,1
    bezier = drift,0.24,0.72,0.32,1

    animation = global, 1, 15, mist
    animation = border, 1, 12, drift
    animation = windows, 1, 11.0, mist
    animation = windowsIn, 1, 7.0, emerge, popin 86%
    animation = windowsOut, 1, 3.8, fade_out, popin 86%
    animation = fadeIn, 1, 5.5, emerge
    animation = fadeOut, 1, 3.0, fade_out
    animation = layers, 1, 8.0, mist
    animation = layersIn, 1, 6.5, emerge, fade
    animation = layersOut, 1, 3.0, fade_out, fade
    animation = workspaces, 1, 5.0, drift, fade
    animation = workspacesIn, 1, 3.5, emerge, fade
    animation = workspacesOut, 1, 5.0, drift, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 16
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Deep Forest  : #0d1a16  (shadow under the arch)
# Pale Mist    : #e2ede6  (light through the fog)
# Misty Teal   : #5fa88f  (the far mountain spires)
# Forest Shadow: #21362e  (moss on old stone)
# Bright Mist  : #a3d9bd  (sunlit haze in the valley)
###############################
