############################################
### INFERNAL RITE — OCCULT VOID/BONE   ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(8a5820cc)   # rust copper — oxidized ritual blade
    col.inactive_border = rgba(0a080644) # void black — the pit itself
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.74
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 28
        render_power = 5
        color = rgba(0a0806bb)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.10
    }
}

animations {
    enabled = yes
    bezier = grind,0.1,0.9,0.0,1
    bezier = extinguish,0.6,0,0.9,0.0
    bezier = summon,0.0,0.95,0.05,1
    bezier = ritual,0.3,0.8,0.2,1

    animation = global, 1, 15, grind
    animation = border, 1, 12, ritual
    animation = windows, 1, 11.0, grind
    animation = windowsIn, 1, 7.0, summon, popin 72%
    animation = windowsOut, 1, 2.5, extinguish, popin 72%
    animation = fadeIn, 1, 5.0, summon
    animation = fadeOut, 1, 2.0, extinguish
    animation = layers, 1, 8.0, grind
    animation = layersIn, 1, 7.0, summon, fade
    animation = layersOut, 1, 2.0, extinguish, fade
    animation = workspaces, 1, 5.0, ritual, fade
    animation = workspacesIn, 1, 3.5, summon, fade
    animation = workspacesOut, 1, 5.0, ritual, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 2
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Void Black   : #0a0806  (the pit between worlds)
# Bone White   : #d0c8b8  (etched in ritual)
# Rust Copper  : #8a5820  (oxidized blade)
# Hellfire     : #c0402a  (demon eye)
# Dark Ash     : #2a1e10  (charred altar)
###############################
