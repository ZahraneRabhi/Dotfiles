############################################
### WINDOWS XP — LUNA BLUE CHROME       ###
############################################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(4e9bffee) rgba(0b3faeee) 45deg   # glossy Luna title bar — light to deep blue
    col.inactive_border = rgba(a8c0e0aa) rgba(5c7aa8aa) 45deg # washed-out grey-blue — the unfocused window
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.98
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000070)
    }

    blur {
        enabled = false
        size = 2
        passes = 1
        new_optimizations = true
        ignore_opacity = false
        vibrancy = 0.0
    }
}

animations {
    enabled = yes
    bezier = winswitch,0.1,0.9,0.1,1
    bezier = minimize,0.5,-0.2,0.7,0.1
    bezier = popin,0.05,0.9,0.05,1
    bezier = snap,0.2,0.7,0.3,1

    animation = global, 1, 8, winswitch
    animation = border, 1, 7, snap
    animation = windows, 1, 6.0, winswitch
    animation = windowsIn, 1, 4.0, popin, popin 90%
    animation = windowsOut, 1, 3.0, minimize, popin 88%
    animation = fadeIn, 1, 3.0, popin
    animation = fadeOut, 1, 2.5, minimize
    animation = layers, 1, 5.0, winswitch
    animation = layersIn, 1, 4.0, popin, fade
    animation = layersOut, 1, 2.5, minimize, fade
    animation = workspaces, 1, 3.0, snap, fade
    animation = workspacesIn, 1, 2.5, popin, fade
    animation = workspacesOut, 1, 3.0, snap, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 6
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Luna Blue Light : #4e9bff  (glossy title-bar sheen)
# Luna Blue Deep  : #0b3fae  (title-bar shade)
# Start Green     : #6fc73e  (the Start button)
# Taskbar Silver  : #a8c0e0  (inactive chrome)
# Cloud White     : #f0faff  (the Bliss sky)
###############################
