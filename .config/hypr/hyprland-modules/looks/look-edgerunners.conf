###############################
### CYBERPUNK NIGHT CITY FX ###
###############################

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 3
    col.active_border = rgba(00fff9cc)   # Tech cyan — active energy edge
    col.inactive_border = rgba(ff003366) # Neon red — dim inactive glow
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14
    rounding_power = 2
    active_opacity = 0.83
    inactive_opacity = 0.7
    fullscreen_opacity = 0.9

    shadow {
        enabled = true
        range = 14
        render_power = 6
        color = rgba(fcee0944)  # Neon yellow diffuse tower glow
    }

    blur {
        enabled = true
        size = 5
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.38  # reflective energy halo
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = quick,0.15,0,0.1,1
    bezier = flick,0.2,0.7,0.3,1

    animation = global, 1, 10, easeOutQuint
    animation = border, 1, 7, easeOutQuint
    animation = windows, 1, 6.3, easeOutQuint
    animation = windowsIn, 1, 4.2, easeOutQuint, popin 85%
    animation = windowsOut, 1, 1.8, linear, popin 85%
    animation = fadeIn, 1, 2.2, quick
    animation = fadeOut, 1, 1.7, quick
    animation = layers, 1, 3.8, easeOutQuint
    animation = layersIn, 1, 4.1, easeOutQuint, fade
    animation = layersOut, 1, 1.8, flick, fade
    animation = workspaces, 1, 2.3, easeInOutCubic, fade
    animation = workspacesIn, 1, 1.5, easeInOutCubic, fade
    animation = workspacesOut, 1, 2.3, easeInOutCubic, fade
}

# === Chrome / Electron Apps Polishing ===
windowrule {
  name = windowrule-1
  tile = on
  rounding = 14
  border_size = 3
  match:class = ^(Chromium|Brave|code)$
}


# === Layouts ===
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# === Misc Settings ===
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

