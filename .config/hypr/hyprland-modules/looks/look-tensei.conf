############################################
### WORLD DOMINATION — MANGA SHINOBI INK ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(1a1a2acc)   # Manga ink — sharp panel border
    col.inactive_border = rgba(8a847844) # Faded line — distant detail border
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 2
    rounding_power = 2
    active_opacity = 0.95
    inactive_opacity = 0.82
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 14
        render_power = 4
        color = rgba(1a1a2a99)  # Manga ink — panel drop shadow
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.08  # near-zero — sepia has almost no chroma
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = panel,0.18,1.0,0.22,1
    bezier = slash,0.8,0,1,0.5

    animation = global, 1, 10, easeOutQuint
    animation = border, 1, 8, panel
    animation = windows, 1, 6.5, panel
    animation = windowsIn, 1, 4.5, panel, slide
    animation = windowsOut, 1, 1.8, slash, slide
    animation = fadeIn, 1, 3.0, panel
    animation = fadeOut, 1, 1.5, slash
    animation = layers, 1, 5.0, easeOutQuint
    animation = layersIn, 1, 5.2, panel, fade
    animation = layersOut, 1, 1.8, slash, fade
    animation = workspaces, 1, 2.8, easeInOutCubic, slide
    animation = workspacesIn, 1, 2.0, panel, slide
    animation = workspacesOut, 1, 2.8, slash, slide
}

# === Chrome / Electron Apps Polishing ===
windowrule {
  name = windowrule-1
  tile = on
  rounding = 2
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

# === Layouts ===
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# === Misc Settings ===
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

