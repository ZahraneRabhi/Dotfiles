############################################
### AMBER SPIRE — SUNSET DISTRICT       ###
############################################

general {
    gaps_in = 5
    gaps_out = 11
    border_size = 1
    col.active_border = rgba(ff8c42cc)   # amber glow — the dying sun
    col.inactive_border = rgba(170b0666) # smog dusk — spire silhouette
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 6
    rounding_power = 2
    active_opacity = 0.90
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 4
        color = rgba(b2380c95)
    }

    blur {
        enabled = true
        size = 6
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.16
    }
}

animations {
    enabled = yes
    bezier = skyline,0.12,0.85,0.1,1
    bezier = descend,0.55,0,0.75,0.05
    bezier = ignite,0.05,0.95,0.1,1
    bezier = haze,0.25,0.75,0.3,1

    animation = global, 1, 11, skyline
    animation = border, 1, 9, haze
    animation = windows, 1, 8.5, skyline
    animation = windowsIn, 1, 5.5, ignite, popin 78%
    animation = windowsOut, 1, 2.8, descend, popin 78%
    animation = fadeIn, 1, 4.0, ignite
    animation = fadeOut, 1, 2.0, descend
    animation = layers, 1, 6.5, skyline
    animation = layersIn, 1, 5.0, ignite, fade
    animation = layersOut, 1, 2.0, descend, fade
    animation = workspaces, 1, 4.0, haze, fade
    animation = workspacesIn, 1, 2.8, ignite, fade
    animation = workspacesOut, 1, 4.0, haze, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 6
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Near-Black Brown : #170b06  (spire silhouette)
# Amber White       : #ffe2b0  (haze-lit cloud)
# Orange            : #ff8c42  (the sinking sun)
# Burnt Orange      : #b2380c  (deep smog shadow)
# Glow Amber        : #ffb347  (sun core)
###############################
