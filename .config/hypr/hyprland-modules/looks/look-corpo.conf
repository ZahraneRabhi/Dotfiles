#############################
### LIGHT PRESENTATION ###
#############################

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(5a8cffdd)    # clear blue focus
    col.inactive_border = rgba(cfd6e255)  # soft gray border
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(00000022)  # subtle shadow for separation
    }

    blur {
        enabled = false  # disable for crisp projection
    }
}

animations {
    enabled = yes

    bezier = easeOutCubic,0.33,1,0.68,1
    bezier = smooth,0.4,0,0.2,1

    animation = global, 1, 6, easeOutCubic
    animation = border, 1, 5, easeOutCubic
    animation = windows, 1, 4, easeOutCubic
    animation = windowsIn, 1, 3.2, easeOutCubic, popin 90%
    animation = windowsOut, 1, 2.2, smooth, popin 90%
    animation = fadeIn, 1, 2.0, smooth
    animation = fadeOut, 1, 1.6, smooth
    animation = fade, 1, 2.5, smooth
    animation = layers, 1, 3.0, easeOutCubic
    animation = layersIn, 1, 3.0, easeOutCubic, fade
    animation = layersOut, 1, 1.6, smooth, fade
    animation = workspaces, 1, 2.0, smooth, fade
}

# === Chromium (and Electron apps) Fixes ===
windowrule {
  name = windowrule-1
  tile = on
  rounding = 10
  border_size = 2
  match:class = ^(Chromium)$
}

# === Layouts ===
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# === Misc ===
misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}
