############################################
### ROSE NEBULA — STELLAR NURSERY BLOOM ###
############################################

general {
    gaps_in = 7
    gaps_out = 14
    border_size = 1
    col.active_border = rgba(d87060cc)   # coral pink — warm nebula dust lit
    col.inactive_border = rgba(05030844) # deep space — outer dark matter
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.87
    inactive_opacity = 0.70
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 26
        render_power = 4
        color = rgba(05030899)
    }

    blur {
        enabled = true
        size = 9
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.18
    }
}

animations {
    enabled = yes
    bezier = bloom,0.1,0.85,0.15,1
    bezier = collapse,0.5,0,0.6,0.05
    bezier = ionize,0.05,0.95,0.1,1
    bezier = nebula,0.25,0.75,0.3,1

    animation = global, 1, 13, bloom
    animation = border, 1, 11, nebula
    animation = windows, 1, 10.0, bloom
    animation = windowsIn, 1, 7.0, ionize, popin 82%
    animation = windowsOut, 1, 3.5, collapse, popin 82%
    animation = fadeIn, 1, 5.0, ionize
    animation = fadeOut, 1, 3.0, collapse
    animation = layers, 1, 8.0, bloom
    animation = layersIn, 1, 7.0, ionize, fade
    animation = layersOut, 1, 3.0, collapse, fade
    animation = workspaces, 1, 5.0, nebula, fade
    animation = workspacesIn, 1, 4.0, ionize, fade
    animation = workspacesOut, 1, 5.0, nebula, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 10
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Deep Space    : #050308  (cosmic dark)
# Coral Pink    : #d87060  (warm nebula dust)
# Stellar Teal  : #206880  (OIII emission)
