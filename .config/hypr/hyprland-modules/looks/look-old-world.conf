############################################
### OLD WORLD — CASTLE ON THE HILL      ###
############################################

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    col.active_border = rgba(c68a52cc)   # terracotta — sunlit stone
    col.inactive_border = rgba(24201055) # umber shadow — the old canvas
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    rounding_power = 2
    active_opacity = 0.94
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(241c1090)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.12
    }
}

animations {
    enabled = yes
    bezier = pastoral,0.22,0.8,0.2,1
    bezier = brush,0.4,0,0.6,0.1
    bezier = unveil,0.1,0.9,0.15,1
    bezier = settle,0.28,0.7,0.35,1

    animation = global, 1, 14, pastoral
    animation = border, 1, 11, settle
    animation = windows, 1, 10.0, pastoral
    animation = windowsIn, 1, 6.5, unveil, popin 84%
    animation = windowsOut, 1, 3.2, brush, popin 84%
    animation = fadeIn, 1, 5.0, unveil
    animation = fadeOut, 1, 2.6, brush
    animation = layers, 1, 7.5, pastoral
    animation = layersIn, 1, 6.0, unveil, fade
    animation = layersOut, 1, 2.6, brush, fade
    animation = workspaces, 1, 4.5, settle, fade
    animation = workspacesIn, 1, 3.2, unveil, fade
    animation = workspacesOut, 1, 4.5, settle, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 8
  border_size = 1
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Warm Umber   : #241c10  (the old varnish)
# Parchment    : #f0e6cc  (sunlit cloud)
# Sage Green   : #7d9467  (the grazing field)
