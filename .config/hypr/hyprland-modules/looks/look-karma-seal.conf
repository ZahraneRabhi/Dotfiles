######################################
### KARMA SEAL — BORUTO BLUE VOID  ###
######################################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(2a8fffcc)   # electric blue — karma mark ignition
    col.inactive_border = rgba(50408044) # deep indigo — sealed power dormant
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2
    active_opacity = 0.92
    inactive_opacity = 0.74
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 18
        render_power = 4
        color = rgba(080c1499)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.22
    }
}

animations {
    enabled = yes
    bezier = strike,0.05,0.7,0.1,1
    bezier = release,0.4,0,0.2,1
    bezier = channel,0,0,1,1
    bezier = surge,0.1,0.9,0.2,1

    animation = global, 1, 8, strike
    animation = border, 1, 6, surge
    animation = windows, 1, 5.0, strike
    animation = windowsIn, 1, 3.5, surge, popin 75%
    animation = windowsOut, 1, 1.8, release, popin 75%
    animation = fadeIn, 1, 2.5, surge
    animation = fadeOut, 1, 1.5, release
    animation = layers, 1, 4.0, strike
    animation = layersIn, 1, 3.5, surge, fade
    animation = layersOut, 1, 1.8, release, fade
    animation = workspaces, 1, 2.5, strike, fade
    animation = workspacesIn, 1, 1.8, surge, fade
    animation = workspacesOut, 1, 2.5, strike, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 4
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

