############################################
### CRIMSON MOON — DEVIL AND BLOOD SKY ###
############################################

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cc0020cc)   # blood crimson — the moon's glow
    col.inactive_border = rgba(0a000444) # obsidian — the lightless void
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2
    active_opacity = 0.88
    inactive_opacity = 0.72
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 5
        color = rgba(0a000499)
    }

    blur {
        enabled = true
        size = 6
        passes = 4
        new_optimizations = true
        ignore_opacity = true
        vibrancy = 0.14
    }
}

animations {
    enabled = yes
    bezier = haunt,0.1,0.9,0.05,1
    bezier = banish,0.6,0,0.8,0.0
    bezier = rise,0.0,0.95,0.05,1
    bezier = linger,0.3,0.7,0.4,1

    animation = global, 1, 13, haunt
    animation = border, 1, 11, linger
    animation = windows, 1, 10.0, haunt
    animation = windowsIn, 1, 6.5, rise, popin 76%
    animation = windowsOut, 1, 2.5, banish, popin 76%
    animation = fadeIn, 1, 4.5, rise
    animation = fadeOut, 1, 2.0, banish
    animation = layers, 1, 7.5, haunt
    animation = layersIn, 1, 6.0, rise, fade
    animation = layersOut, 1, 2.0, banish, fade
    animation = workspaces, 1, 4.5, linger, fade
    animation = workspacesIn, 1, 3.0, rise, fade
    animation = workspacesOut, 1, 4.5, linger, fade
}

windowrule {
  name = windowrule-1
  tile = on
  rounding = 4
  border_size = 2
  match:class = ^(Chromium|Brave|code)$
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    mouse_move_enables_dpms = false
    animate_manual_resizes = true
}

###############################
### PALETTE REFERENCE       ###
###############################
# Obsidian     : #0a0004  (lightless void)
# Blood Crimson: #cc0020  (the moon itself)
# Ash White    : #f8e8e0  (bone in red light)
# Dark Crimson : #500010  (cloud silhouette)
# Alarm Red    : #ff0830  (peak lunar glow)
###############################
